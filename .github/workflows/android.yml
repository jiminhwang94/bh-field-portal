name: 안드로이드 APK 빌드

# 태블릿에 설치할 APK 를 GitHub 서버가 대신 만들어 준다.
# (작업용 맥에 Node·안드로이드 SDK 를 설치할 필요가 없다)
#
# 사용법
#   1) GitHub 저장소 → Actions → "안드로이드 APK 빌드" → [Run workflow]
#   2) 5~10분 뒤 Releases 페이지에 APK 가 올라온다
#   3) 태블릿 크롬으로 그 링크를 열어 다운로드 → 설치
#
# v3.0.0 처럼 태그를 붙여 push 해도 자동으로 만들어진다.

on:
  workflow_dispatch:
    inputs:
      note:
        description: '이번 배포 설명 (선택)'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write        # Releases 에 APK 를 올리기 위해 필요

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 자바 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 서버에 이미 깔린 gradle 은 버전을 알 수 없다(너무 새 버전이면
      # 안드로이드 플러그인과 안 맞아 빌드가 죽는다). 필요한 버전을 고정 설치한다.
      - name: Gradle 8.7 설치
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 앱 화면 파일이 하나라도 빠지면 오프라인에서 열리지 않는다.
      - name: 오프라인 실행 보장 확인
        run: python tests/test_offline_shell.py

      - name: 앱 화면 파일을 APK 안에 넣기
        run: |
          mkdir -p android/app/src/main/assets
          cp -r web/. android/app/src/main/assets/
          echo "APK 에 담은 파일:"
          find android/app/src/main/assets -type f | wc -l

      - name: 서명 키 준비
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            echo "signed=release" >> "$GITHUB_OUTPUT"
            echo "::notice::등록된 서명 키로 서명합니다. 기존 앱 위에 덮어 설치됩니다."
          else
            echo "signed=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::서명 키가 등록되어 있지 않아 임시 키로 서명합니다. \
            빌드할 때마다 키가 달라지므로, 새 APK 를 설치하려면 기존 앱을 지워야 하고 \
            그때 기기에 저장된 리포트가 사라집니다. \
            README 12장을 보고 ANDROID_KEYSTORE_BASE64 등을 등록하세요."
          fi

      - name: APK 빌드
        working-directory: android
        env:
          BH_BUILD_NUMBER: ${{ github.run_number }}
          BH_SIGNING: ${{ steps.signing.outputs.signed }}
          BH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK 이름 정리
        id: apk
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          # 파일 이름은 영문으로 짓는다. Releases 는 한글을 지워 버려서
          # "현장포털-v3.0.0-빌드6.apk" 가 "-v3.0.0-.6.apk" 로 올라간다.
          # 버전은 build.gradle 한 곳에서만 읽는다 (여기 따로 적으면 어긋난다)
          VER=$(grep -oP 'appVersionName = "\K[^"]+' android/app/build.gradle)
          NAME="FieldPortal-v${VER}-build${{ github.run_number }}.apk"
          cp "$SRC" "$NAME"
          SIZE_MB=$(awk "BEGIN { printf \"%.1f\", $(stat -c %s "$NAME") / 1048576 }")
          echo "path=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      # ⚠️ 여기(Artifacts/유물)에서 받은 파일은 GitHub 규칙상 무조건 zip 으로
      #    포장되어 있어 태블릿에서 바로 설치되지 않는다. 설치용은 Releases 에서!
      - name: 빌드 결과 보관 (개발 확인용 — 설치는 Releases 에서)
        uses: actions/upload-artifact@v4
        with:
          name: apk-zip으로-포장됨-설치는-Releases에서
          path: ${{ steps.apk.outputs.path }}

      - name: 안내문 출력
        run: |
          {
            echo "## 📱 태블릿 설치 안내"
            echo ""
            echo "⚠️ **이 화면 아래 '유물(Artifacts)'의 파일은 zip 으로 포장되어 있어 그대로 설치되지 않습니다.**"
            echo ""
            echo "설치용 APK 는 저장소의 **[Releases 페이지](../../releases)** 에서 받으세요."
            echo "(태블릿 크롬으로 열어 .apk 파일을 직접 다운로드 → 설치)"
            echo ""
            echo "이전에 다른 서명의 앱을 설치한 적이 있으면, 설정 → 애플리케이션에서"
            echo "**현장 포털을 삭제한 뒤** 설치해야 합니다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Releases 에 올리기 (태블릿 다운로드용)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 현장 포털 v${{ steps.apk.outputs.version }} (빌드 ${{ github.run_number }})
          files: ${{ steps.apk.outputs.path }}
          body: |
            ## 태블릿에 설치하는 방법

            이미 앱을 쓰고 있다면 앱 상단의 **[업데이트]** 띠를 누르는 것이 가장 쉽습니다.
            (새 버전이 있을 때만 나타납니다. 5분마다 확인합니다.)


            1. **태블릿 크롬**으로 이 페이지를 열고 아래 `.apk` 파일을 누릅니다.
            2. "출처를 알 수 없는 앱" 경고가 나오면 → [설정] → **이 출처 허용** (최초 1회만)
            3. 설치 후 홈 화면의 **현장 포털** 아이콘으로 실행합니다.
            4. 첫 실행 때 `⚙️ 설정 → 사무실 서버 주소`에 사무실 PC 주소를 넣고
               (예: `http://192.168.0.83:8787`) **[📥 서버에서 최신 자료 받기]** 를 한 번 누릅니다.
               → 이후에는 **인터넷이 없어도** 가이드 열람·검색·수정, 리포트 작성,
               재고 수정이 전부 됩니다.

            서명 방식: `${{ steps.signing.outputs.signed }}`
            ${{ steps.signing.outputs.signed == 'debug' && '⚠️ 임시 키로 서명되었습니다. 기존 앱을 지우고 설치해야 하며, 기기에 저장된(아직 시트에 올리지 않은) 리포트가 사라집니다. README 12장의 서명 키 등록을 먼저 하세요.' || '기존 앱 위에 그대로 덮어 설치됩니다. 데이터는 유지됩니다.' }}

            ${{ github.event.inputs.note }}

      # ── Dropbox 에 APK 보관 + 시트 '앱 버전' 탭에 기록 (앱 안 [업데이트] 띠용) ──
      #
      # 태블릿은 시트를 받아올 때 '앱 버전' 탭을 함께 보고, 지금 버전보다 높으면
      # 상단에 [업데이트] 띠를 띄운다. 누르면 Dropbox 에서 APK 를 받아 설치한다.
      #
      # ▣ 한 번만 (사장님 Dropbox 계정으로)
      #  1. https://www.dropbox.com/developers/apps → [Create app]
      #       Scoped access · Full Dropbox · 이름 예: 현장포털-빌드
      #  2. [Permissions] 탭에서 켜기:  files.content.write · sharing.write · sharing.read
      #     → [Submit]
      #  3. [Settings] 탭의 App key · App secret 을 GitHub 비밀값으로:
      #       DROPBOX_APP_KEY · DROPBOX_APP_SECRET
      #  4. 갱신 토큰(만료 없음) 발급 — 브라우저에서 (APP_KEY 자리에 실제 키):
      #       https://www.dropbox.com/oauth2/authorize?client_id=APP_KEY&response_type=code&token_access_type=offline
      #     [허용] 뒤 화면의 코드를 복사하고, 터미널에서:
      #       curl https://api.dropbox.com/oauth2/token -d code=복사한코드 -d grant_type=authorization_code -u APP_KEY:APP_SECRET
      #     응답의 "refresh_token" 값을 GitHub 비밀값으로:  DROPBOX_REFRESH_TOKEN
      #  5. 저장소 변수 SHEETS_WEBAPP_URL = 팀 공용 Apps Script 웹 앱 URL (이미 등록됨)
      #
      #  비밀값이 없으면 이 부분은 **조용히 건너뛴다** (APK 빌드·Releases 는 그대로).
      - name: Dropbox 인증이 있는지 확인
        id: dbx
        env:
          KEY: ${{ secrets.DROPBOX_APP_KEY }}
          SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          REFRESH: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          if [ -n "$KEY" ] && [ -n "$SECRET" ] && [ -n "$REFRESH" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice::DROPBOX_APP_KEY / DROPBOX_APP_SECRET / DROPBOX_REFRESH_TOKEN 이 없어 Dropbox 보관과 앱 업데이트 안내를 건너뜁니다. 워크플로 파일의 ▣ 안내를 참고하세요."
          fi

      - name: Dropbox 에 올리고 공유 링크 만들기
        id: upload
        if: steps.dbx.outputs.ready == 'yes'
        env:
          KEY: ${{ secrets.DROPBOX_APP_KEY }}
          SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          REFRESH: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          FILE: ${{ steps.apk.outputs.path }}
        run: |
          set -o pipefail
          # 갱신 토큰 → 4시간짜리 접근 토큰
          TOKEN=$(curl -sf https://api.dropbox.com/oauth2/token \
                    -d grant_type=refresh_token -d refresh_token="$REFRESH" \
                    -u "$KEY:$SECRET" | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::Dropbox 접근 토큰을 받지 못했습니다. DROPBOX_REFRESH_TOKEN 이 맞는지 확인하세요."
            exit 1
          fi
          # 폴더는 영문으로 — Dropbox-API-Arg 헤더는 ASCII 만 받는다
          DEST="/FieldPortal/apk/$FILE"
          curl -sf https://content.dropboxapi.com/2/files/upload \
            -H "Authorization: Bearer $TOKEN" \
            -H "Dropbox-API-Arg: {\"path\":\"$DEST\",\"mode\":\"overwrite\",\"mute\":true}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$FILE" > /dev/null
          echo "Dropbox 저장: $DEST"

          # 공유 링크 — 이미 있으면 그것을 쓴다
          LINK=$(curl -s https://api.dropboxapi.com/2/sharing/create_shared_link_with_settings \
                   -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                   -d "{\"path\":\"$DEST\",\"settings\":{\"requested_visibility\":\"public\"}}" \
                 | jq -r '.url // empty')
          if [ -z "$LINK" ]; then
            LINK=$(curl -s https://api.dropboxapi.com/2/sharing/list_shared_links \
                     -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                     -d "{\"path\":\"$DEST\",\"direct_only\":true}" \
                   | jq -r '.links[0].url // empty')
          fi
          if [ -z "$LINK" ]; then
            echo "::error::Dropbox 공유 링크를 만들지 못했습니다. 앱 권한(sharing.write)과 팀 정책(공개 링크 허용)을 확인하세요."
            exit 1
          fi
          # 브라우저 미리보기(dl=0) 대신 바로 내려받기(dl=1). rlkey 등 다른 인자는 그대로 둔다.
          if echo "$LINK" | grep -q 'dl=0'; then
            DIRECT=$(echo "$LINK" | sed 's/dl=0/dl=1/')
          elif echo "$LINK" | grep -q '?'; then
            DIRECT="$LINK&dl=1"
          else
            DIRECT="$LINK?dl=1"
          fi
          echo "url=$DIRECT" >> "$GITHUB_OUTPUT"
          echo "다운로드 링크: $DIRECT"

      - name: 시트 '앱 버전' 탭에 기록
        if: steps.dbx.outputs.ready == 'yes'
        env:
          WEBAPP: ${{ vars.SHEETS_WEBAPP_URL }}
          VERSION: ${{ steps.apk.outputs.version }}
          SIZE_MB: ${{ steps.apk.outputs.size_mb }}
          URL: ${{ steps.upload.outputs.url }}
          NOTE: ${{ github.event.inputs.note }}
        run: |
          if [ -z "$WEBAPP" ]; then
            echo "::error::저장소 변수 SHEETS_WEBAPP_URL 이 없습니다."
            exit 1
          fi
          NOTES="${NOTE:-$(git log -1 --pretty=%s)}"
          BODY=$(jq -n --arg v "$VERSION" --arg b "${{ github.run_number }}" --arg u "$URL" \
                       --arg n "$NOTES" --argjson s "${SIZE_MB:-0}" \
                       '{release:"publish", version:$v, build:$b, url:$u, notes:$n, sizeMb:$s}')
          RES=$(curl -sL -H 'Content-Type: text/plain;charset=utf-8' --data "$BODY" "$WEBAPP")
          echo "$RES"
          echo "$RES" | jq -e '.ok == true' > /dev/null || { echo "::error::시트 기록 실패"; exit 1; }
          {
            echo ""
            echo "## 앱 업데이트 안내 등록"
            echo ""
            echo "- 버전 **v$VERSION** (빌드 ${{ github.run_number }}) · ${SIZE_MB}MB"
            echo "- Dropbox: $URL"
            echo "- 태블릿은 5분 안에 상단 [업데이트] 띠를 봅니다. 막으려면 시트 '앱 버전' 탭의 공개 칸을 N 으로."
          } >> "$GITHUB_STEP_SUMMARY"
