name: 매일 상태 점검

# 매일 오전 8시(한국) 팀 서버에 "상태" 를 묻는다 (읽기만 — 시트를 바꾸지 않는다).
# 지난 24시간 기기 오류 · 올리지 못한 기기 · 매일 백업을 보고, 문제가 있으면 이슈로 알린다.
# 이미 열린 점검 이슈가 있으면 새로 만들지 않고 댓글을 단다 (다 보면 이슈를 닫으면 된다).
on:
  schedule:
    - cron: '0 23 * * *'        # UTC 23시 = 한국 오전 8시
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: 서버에 상태 묻기
        run: |
          URL=$(grep -oE "https://script.google.com/macros/s/[A-Za-z0-9_-]+/exec" web/js/local/store-core.js | head -1)
          curl -sSL --max-time 90 -H 'Content-Type: text/plain;charset=utf-8' \
            -d '{"health":true}' "$URL" -o health.json || echo '{"ok":false,"error":"서버에 닿지 못했습니다"}' > health.json
      - name: 문제가 있으면 이슈로
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if node tools/health_report.mjs health.json > report.md; then
            cat report.md
            exit 0
          fi
          cat report.md
          gh label create '상태점검' --color d93f0b --description '매일 자동 상태 점검' 2>/dev/null || true
          OPEN=$(gh issue list --label '상태점검' --state open --json number -q '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body-file report.md
          else
            gh issue create --title '현장 포털 상태 점검 — 확인 필요' --label '상태점검' --body-file report.md
          fi
