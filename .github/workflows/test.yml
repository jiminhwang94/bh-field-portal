name: 테스트

# push / PR 마다 회귀 테스트를 자동 실행한다.
# 실패하면 GitHub 에서 빨간 X 로 표시되므로 "테스트 돌리는 걸 잊는" 문제를 막는다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 개발 PC(3.10)와 최신 버전 모두에서 동작하는지 확인
        python: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # test_sync_flow.mjs 는 module.registerHooks 를 쓴다 (Node 22.15 이상)
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 문법 검사 (외부 의존성 없음)
        run: python -m compileall -q server.py tools tests

      # tests/ 의 test_*.py · test_*.mjs 를 전부 찾아 돌린다 — 개발 PC 와 같은 명령.
      # 새 검사 파일을 만들면 여기 적지 않아도 함께 돈다.
      - name: 개발 도구 (타입 검사기)
        run: npm ci

      - name: 검사 전부 (타입 검사 포함)
        run: python tools/run_tests.py

  # 실제 브라우저(크로미움)로 화면을 눌러 보는 검사. 가짜 시트 서버를 띄우므로
  # 팀 시트에는 아무것도 적히지 않는다.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Playwright 준비
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: 화면 검사 (E2E)
        run: npx playwright test
      - name: 실패하면 화면 기록 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/

  # APK 가 **만들어지는지만** 본다 (v3.36 — 영상 줄이기로 네이티브 코드가 늘었다).
  # 태그를 올려야 도는 배포 빌드(android.yml)에서야 컴파일 오류를 알면 늦다.
  # 서명 · 업로드 · 시트 기록은 하지 않는다 — 임시 키로 debug 빌드만.
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: 앱 화면 파일을 APK 안에 넣기
        run: |
          mkdir -p android/app/src/main/assets
          cp -r web/. android/app/src/main/assets/
      - name: APK 빌드 (debug · 컴파일 확인)
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
