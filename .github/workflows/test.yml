name: 테스트

# push / PR 마다 회귀 테스트를 자동 실행한다.
# 실패하면 GitHub 에서 빨간 X 로 표시되므로 "테스트 돌리는 걸 잊는" 문제를 막는다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 개발 PC(3.10)와 최신 버전 모두에서 동작하는지 확인
        python: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # test_sync_flow.mjs 는 module.registerHooks 를 쓴다 (Node 22.15 이상)
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 문법 검사 (외부 의존성 없음)
        run: python -m compileall -q server.py tools tests

      - name: 오프라인 실행 보장 (서비스워커 캐시 목록)
        run: python tests/test_offline_shell.py

      - name: 리포트 이력 계약 검사
        run: python tests/test_report_history.py

      - name: 화면 ↔ 스타일 계약 검사
        run: python tests/test_css_contract.py

      - name: 새 리포트/수정 분리 + 요청 폭주 방지 검사
        run: python tests/test_report_draft.py

      - name: 화면이 디자인 구조를 따르는지 검사
        run: python tests/test_design_contract.py

      - name: Apps Script 실제 실행 검사
        run: node tests/test_apps_script.mjs

      - name: 화면 코드가 브라우저에서 읽히는지 검사
        run: node --experimental-vm-modules tests/test_js_parses.mjs

      - name: 올리기·받기 검사 (지운 것이 되살아나지 않는지 · 두 기기)
        run: node tests/test_sync_flow.mjs

      - name: 그 밖의 계약 검사 (운행일지 · 가이드 탭 · 재고 묶음 · 새 내용 알림 · 피드백)
        run: |
          python tests/test_driving.py
          python tests/test_guide_hub.py
          python tests/test_inventory_groups.py
          python tests/test_change_watch.py
          python tests/test_feedback_v323.py

      - name: 화면 서버 검사 (화면 파일만 내주는지)
        run: python tests/test_static_host.py

      - name: 앱 업데이트 흐름 검사 (CI · 시트 · 화면 · 안드로이드)
        run: python tests/test_update_flow.py
