name: 테스트

# push / PR 마다 회귀 테스트를 자동 실행한다.
# 실패하면 GitHub 에서 빨간 X 로 표시되므로 "테스트 돌리는 걸 잊는" 문제를 막는다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 개발 PC(3.10)와 최신 버전 모두에서 동작하는지 확인
        python: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 문법 검사 (외부 의존성 없음)
        run: python -m compileall -q server.py app tools tests

      - name: 오프라인 실행 보장 (서비스워커 캐시 목록)
        run: python tests/test_offline_shell.py

      - name: 기기 ↔ 서버 동기화 모델 테스트
        run: python tests/test_sync_model.py

      - name: 구글 시트 전송 검사
        run: python tests/test_sheets_relay.py

      - name: 리포트 이력 계약 검사
        run: python tests/test_report_history.py

      - name: 화면 ↔ 스타일 계약 검사
        run: python tests/test_css_contract.py

      - name: APK 앱 ↔ 서버 연결 규칙 테스트
        run: python tests/test_apk_cors.py

      - name: 서버 API 스모크 테스트
        env:
          BH_DATA_DIR: /tmp/ci-data
        run: |
          python server.py --port 8788 --host 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8788/api/version > /dev/null && break
            sleep 0.5
          done
          python tests/test_api_smoke.py

      - name: 동시 업데이트 덮어쓰기 방지 검사
        env:
          BH_DATA_DIR: /tmp/ci-conflict
          BH_TEST_BASE: http://127.0.0.1:8793
        run: |
          python server.py --port 8793 --host 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8793/api/version > /dev/null && break
            sleep 0.5
          done
          python tests/test_publish_conflict.py
