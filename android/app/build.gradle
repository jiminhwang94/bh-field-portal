plugins {
    id 'com.android.application'
}

// 앱 버전 — web/js/api.js 의 APP_VERSION 과 맞춘다.
def appVersionName = "3.13.0"
// 설치 시 "더 낮은 버전" 으로 거부되지 않도록 배포마다 올라가는 번호.
// GitHub Actions 가 빌드 번호를 넣어 주고, 없으면 1 을 쓴다.
def buildNumber = (System.getenv("BH_BUILD_NUMBER") ?: "1") as Integer

// 서명 키가 등록돼 있으면(GitHub Secrets) 그 키로 서명한다.
// 없으면 임시(debug) 키로 서명한다 — 설치는 되지만 빌드마다 키가 달라져
// 기존 앱 위에 덮어 설치할 수 없다. (README 12장 참고)
def hasReleaseKey = System.getenv("BH_SIGNING") == "release" &&
        file("release.jks").exists()

android {
    namespace 'com.beyondhoneycomb.fieldportal'
    compileSdk 34

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file("release.jks")
                storePassword System.getenv("BH_KEYSTORE_PASSWORD")
                keyAlias System.getenv("BH_KEY_ALIAS")
                keyPassword System.getenv("BH_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId "com.beyondhoneycomb.fieldportal"
        minSdk 24              // Android 7.0 이상 (2016년 이후 기기)
        targetSdk 34
        versionCode buildNumber
        versionName appVersionName
    }

    buildTypes {
        release {
            // 코드 축소는 쓰지 않는다 — WebView 껍데기라 얻는 게 없고 디버깅만 어려워진다.
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }
}

dependencies {
    // androidx 부품들이 서로 다른 코틀린 표준 라이브러리 버전을 끌고 오면
    // "Duplicate class kotlin..." 으로 빌드가 실패한다. BOM 으로 한 버전에 정렬한다.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'      // WebViewAssetLoader
    implementation 'androidx.activity:activity:1.9.2'   // 뒤로가기 · 결과 받기
}
