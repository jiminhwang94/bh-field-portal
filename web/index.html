<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- 앱은 항상 흰 바탕이다 (다크 모드 없음) -->
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="현장 포털" />
  <title>비욘드허니컴 현장 포털</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
</head>
<body>
<div class="app">

  <!-- 상단바 : 브랜드 · 동기화 상태(항상 노출) · [새로고침] -->
  <header class="topbar">
    <button class="btn btn--icon btn--ghost" id="backBtn" type="button" aria-label="뒤로"
            hidden>‹</button>
    <a class="topbar__brand" href="#/">비욘드허니컴 현장 포털</a>
    <button class="sync" id="sync-chip" type="button"
            title="아직 올리지 않은 내용 보기">
      <span class="sync__dot"></span>
      <span id="sync-text">시트와 같은 내용</span>
    </button>
    <span class="topbar__spacer"></span>
    <button class="btn btn-primary btn-update" id="btn-update" type="button"
            title="다른 사람이 바꾼 내용을 지금 받아옵니다 (올리기는 자동)">새로고침</button>
  </header>

  <!-- 오프라인일 때만 표시 (net.js 가 토글) -->
  <div class="offline-banner" id="offline-banner" hidden>
    📴 오프라인 — 기기에 저장하며 계속 사용할 수 있습니다 ·
    대기 중 <span class="tnum" id="queue-count">0</span>건
  </div>

  <main id="view" class="screen" aria-live="polite"></main>

  <!-- 좌측 레일 (좁은 화면에서는 하단 탭바) -->
  <nav class="tabbar" aria-label="주요 화면">
    <span class="tabbar__mark" aria-hidden="true"></span>
    <a class="tab" data-tab="home" href="#/">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      <span>홈</span>
    </a>
    <a class="tab" data-tab="inventory" href="#/inventory">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h11v10H2z"/><path d="M13 9h5l3 3.5V16h-8z"/><circle cx="6.5" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>
      <span>재고</span>
    </a>
    <a class="tab" data-tab="new" href="#/report/new">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h8l4 4v16H6z"/><path d="M12 11v6M9 14h6"/></svg>
      <span>새 리포트</span>
    </a>
    <a class="tab" data-tab="reports" href="#/reports">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h7l2 2h9v11H3z"/><path d="M3 7V4h6v3"/></svg>
      <span>이력</span>
    </a>
    <a class="tab" data-tab="settings" href="#/settings">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <span>설정</span>
    </a>
  </nav>
</div>

<div id="toasts" class="toasts" aria-live="assertive"></div>
<div id="modalRoot"></div>

<script>
  // 설치 프롬프트 이벤트는 모듈 로드보다 먼저 올 수 있어 미리 보관한다.
  window.addEventListener('beforeinstallprompt', function (event) {
    event.preventDefault();
    window.__bhInstallPrompt = event;
    window.dispatchEvent(new Event('bh-install-available'));
  });
</script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
