<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="현장 포털" />
  <title>로봇 현장 대응 포털</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
</head>
<body>
  <header class="appbar">
    <button class="appbar__back" id="backBtn" type="button" aria-label="뒤로">‹</button>
    <a class="appbar__title" href="#/">
      <span class="appbar__logo">🤖</span>
      <span>로봇 현장 대응 포털</span>
    </a>
    <nav class="appbar__actions">
      <button class="chip chip--sync" id="publishBtn" type="button"
              title="내가 만든/수정한 내용을 모든 사용자에게 적용">
        ⬆️ <span class="chip__label">업데이트</span>
      </button>
      <span class="appbar__divider"></span>
      <a class="chip" href="#/inventory">🚐 <span class="chip__label">재고</span></a>
      <a class="chip" href="#/reports">🗂 <span class="chip__label">리포트</span></a>
      <a class="chip" href="#/fields">🧩 <span class="chip__label">항목 설정</span></a>
      <a class="chip" href="#/settings">⚙️ <span class="chip__label">설정</span></a>
    </nav>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <div class="bottombar">
    <a class="btn btn--primary btn--xl" href="#/report/new">📝 새 현장 리포트 작성하기</a>
  </div>

  <div id="toasts" class="toasts" aria-live="assertive"></div>
  <div id="modalRoot"></div>

  <script>
    // 설치 프롬프트 이벤트는 모듈 로드보다 먼저 올 수 있어 미리 보관한다.
    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      window.__bhInstallPrompt = event;
      window.dispatchEvent(new Event('bh-install-available'));
    });
  </script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
